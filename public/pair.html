<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/AmonTech1/REAPER-XMD/a3aa6169969c7872247b6beeabd87192d7d33378/REAPER-XMD.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REAPER-XMD | PAIRING CODE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== LOADING PAGE ===== */
        #loading-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loading-page.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(138, 43, 226, 0.1);
            border-top: 4px solid #8a2be2;
            border-right: 4px solid #ff69b4;
            animation: spin 1s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2), 0 0 60px rgba(255, 105, 180, 0.1);
        }

        .loader-text {
            font-size: 1.2rem;
            font-weight: 300;
            color: #d3d3d3;
            letter-spacing: 3px;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        .loader-dots {
            display: inline-flex;
            gap: 6px;
            margin-left: 8px;
        }

        .loader-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8a2be2;
            animation: dotBounce 1.4s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ===== MAIN STYLES ===== */
        :root {
            --primary: #8a2be2;
            --secondary: #9932cc;
            --accent: #ff69b4;
            --neon-purple: #8a2be2;
            --neon-pink: #ff69b4;
            --neon-blue: #00d4ff;
            --text: #ffffff;
            --text-light: #d3d3d3;
            --background: #0a0a0a;
            --card-bg: #111111;
            --input-bg: #1a1a1a;
            --success: #4caf50;
            --error: #f44336;
            --shadow: 0 0 40px rgba(138, 43, 226, 0.2);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.6;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== SNAKE LIGHT BACKGROUND ===== */
        .snake-lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .snake {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: snakeMove linear infinite;
            box-shadow: 0 0 15px currentColor, 0 0 30px currentColor;
        }

        .snake:nth-child(1) { 
            background: #8a2be2; 
            color: #8a2be2;
            animation-duration: 20s; 
            top: 10%; 
            left: -5%;
            animation-delay: 0s;
        }
        .snake:nth-child(2) { 
            background: #ff69b4; 
            color: #ff69b4;
            animation-duration: 25s; 
            top: 30%; 
            left: -5%;
            animation-delay: 2s;
        }
        .snake:nth-child(3) { 
            background: #00d4ff; 
            color: #00d4ff;
            animation-duration: 22s; 
            top: 50%; 
            left: -5%;
            animation-delay: 4s;
        }
        .snake:nth-child(4) { 
            background: #8a2be2; 
            color: #8a2be2;
            animation-duration: 18s; 
            top: 70%; 
            left: -5%;
            animation-delay: 1s;
        }
        .snake:nth-child(5) { 
            background: #ff69b4; 
            color: #ff69b4;
            animation-duration: 28s; 
            top: 90%; 
            left: -5%;
            animation-delay: 3s;
        }
        .snake:nth-child(6) { 
            background: #00d4ff; 
            color: #00d4ff;
            animation-duration: 24s; 
            top: 20%; 
            right: -5%;
            animation-delay: 5s;
            animation-direction: reverse;
        }
        .snake:nth-child(7) { 
            background: #8a2be2; 
            color: #8a2be2;
            animation-duration: 26s; 
            top: 45%; 
            right: -5%;
            animation-delay: 2s;
            animation-direction: reverse;
        }
        .snake:nth-child(8) { 
            background: #ff69b4; 
            color: #ff69b4;
            animation-duration: 19s; 
            top: 65%; 
            right: -5%;
            animation-delay: 4s;
            animation-direction: reverse;
        }

        @keyframes snakeMove {
            0% { transform: translateX(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(110vw) scale(1.5); opacity: 0; }
        }

        /* ===== NEON GRID ===== */
        .neon-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(138, 43, 226, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(138, 43, 226, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* ===== NEON GLOW ORBS ===== */
        .neon-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: orbFloat 15s ease-in-out infinite;
        }

        .neon-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: rgba(138, 43, 226, 0.08);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .neon-orb:nth-child(2) {
            width: 350px;
            height: 350px;
            background: rgba(255, 105, 180, 0.06);
            bottom: -80px;
            right: -80px;
            animation-delay: 5s;
        }

        .neon-orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: rgba(0, 212, 255, 0.05);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(10px, -10px) scale(1.05); }
        }

        /* ===== HOME BUTTON ===== */
        .home-btn {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3), 0 0 60px rgba(138, 43, 226, 0.1);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            animation: slideInRight 0.8s ease 1.2s both;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }

        .home-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.5), 0 0 100px rgba(255, 105, 180, 0.2);
        }

        @keyframes slideInRight {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            background: linear-gradient(145deg, rgba(17, 17, 17, 0.95), rgba(10, 10, 10, 0.98));
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 
                0 0 40px rgba(138, 43, 226, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(138, 43, 226, 0.15);
            animation: fadeInUp 0.8s ease 0.6s both;
            z-index: 1;
        }

        /* ===== NEON BORDER ===== */
        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(138, 43, 226, 0.3) 25%,
                rgba(255, 105, 180, 0.3) 50%,
                rgba(0, 212, 255, 0.3) 75%,
                transparent 100%
            );
            border-radius: 26px;
            z-index: -1;
            animation: borderRotate 4s linear infinite;
            filter: blur(2px);
        }

        .container::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(138, 43, 226, 0.1) 25%,
                rgba(255, 105, 180, 0.1) 50%,
                rgba(0, 212, 255, 0.1) 75%,
                transparent 100%
            );
            border-radius: 26px;
            z-index: -1;
            animation: borderRotate 4s linear infinite reverse;
        }

        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== NEON SHIMMER BAR ===== */
        .shimmer-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent, 
                #8a2be2, 
                #ff69b4, 
                #00d4ff,
                #8a2be2, 
                transparent
            );
            background-size: 200% 100%;
            animation: shimmerSlide 3s linear infinite;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        @keyframes shimmerSlide {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== HEADER ===== */
        .header-icon {
            font-size: 3rem;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.3));
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.3)); }
            50% { filter: drop-shadow(0 0 40px rgba(138, 43, 226, 0.6)); }
        }

        h1 {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            animation: fadeInUp 0.8s ease 0.8s both;
            text-shadow: 0 0 40px rgba(138, 43, 226, 0.2);
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease 1s both;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
            animation: fadeInUp 0.8s ease 1.2s both;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .input-container {
            position: relative;
            transition: var(--transition);
        }

        .input-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1rem;
            transition: var(--transition);
            z-index: 1;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid rgba(138, 43, 226, 0.2);
            border-radius: 14px;
            background-color: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            transition: var(--transition);
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.2), 0 0 40px rgba(138, 43, 226, 0.1);
            transform: scale(1.01);
        }

        .input-container:focus-within i {
            color: var(--primary);
        }

        /* ===== NEON INPUT GLOW ===== */
        .input-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 16px;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(138, 43, 226, 0.3) 25%,
                rgba(255, 105, 180, 0.3) 50%,
                rgba(0, 212, 255, 0.3) 75%,
                transparent 100%
            );
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 0;
        }

        .input-container:focus-within::before {
            opacity: 1;
            animation: borderRotate 3s linear infinite;
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            animation: fadeInUp 0.8s ease 1.4s both;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: var(--transition);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3), 0 0 60px rgba(138, 43, 226, 0.1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 1px;
            z-index: 1;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.5), 0 0 100px rgba(255, 105, 180, 0.2);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid rgba(138, 43, 226, 0.4);
            box-shadow: none;
            color: var(--text);
        }

        .btn-secondary:hover {
            background: rgba(138, 43, 226, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.2);
        }

        .btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        .btn i {
            font-size: 1.1rem;
        }

        /* ===== LOADING SPINNER ===== */
        #loading-spinner {
            display: none;
            margin: 1.5rem 0;
            animation: fadeInUp 0.3s ease both;
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto;
            border: 4px solid rgba(138, 43, 226, 0.1);
            border-top: 4px solid var(--primary);
            border-right: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== RESULT ===== */
        #result {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 16px;
            display: none;
            animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            background: linear-gradient(145deg, rgba(138, 43, 226, 0.08), rgba(255, 105, 180, 0.05));
            border: 1px solid rgba(138, 43, 226, 0.15);
            backdrop-filter: blur(5px);
            position: relative;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.1);
        }

        #result::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: 17px;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(138, 43, 226, 0.2) 25%,
                rgba(255, 105, 180, 0.2) 50%,
                rgba(0, 212, 255, 0.2) 75%,
                transparent 100%
            );
            z-index: -1;
            animation: borderRotate 4s linear infinite;
        }

        @keyframes resultPop {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        #result p {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        #pair-code {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0.8rem 0;
            letter-spacing: 4px;
            animation: codeGlow 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(138, 43, 226, 0.3));
        }

        @keyframes codeGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.3)); }
            50% { filter: drop-shadow(0 0 50px rgba(138, 43, 226, 0.6)) drop-shadow(0 0 80px rgba(255, 105, 180, 0.3)); }
        }

        /* ===== ACTION BUTTONS ===== */
        .action-buttons {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
        }

        .copy-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.5);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .back-btn {
            background: transparent;
            color: var(--text);
            border: 2px solid rgba(138, 43, 226, 0.3);
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(138, 43, 226, 0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
        }

        /* ===== MESSAGES ===== */
        .error-message {
            color: var(--error);
            margin-top: 0.5rem;
            font-size: 0.85rem;
            display: none;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .success-message {
            color: var(--success);
            margin-top: 0.8rem;
            display: none;
            animation: fadeInUp 0.3s ease both;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
                border-radius: 20px;
                margin: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .header-icon {
                font-size: 2.5rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .home-btn {
                top: 1rem;
                right: 1rem;
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }

            #pair-code {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }

            .btn {
                padding: 14px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.2rem;
            }

            input[type="text"] {
                padding: 14px 14px 14px 42px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== SNAKE LIGHTS ===== -->
    <div class="snake-lights">
        <div class="snake"></div>
        <div class="snake"></div>
        <div class="snake"></div>
        <div class="snake"></div>
        <div class="snake"></div>
        <div class="snake"></div>
        <div class="snake"></div>
        <div class="snake"></div>
    </div>

    <!-- ===== NEON ORBS ===== -->
    <div class="neon-orb"></div>
    <div class="neon-orb"></div>
    <div class="neon-orb"></div>

    <!-- ===== NEON GRID ===== -->
    <div class="neon-grid"></div>

    <!-- ===== LOADING PAGE ===== -->
    <div id="loading-page">
        <div class="loader-ring"></div>
        <div class="loader-text">
            LOADING
            <span class="loader-dots">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </div>
    </div>

    <!-- ===== HOME BUTTON ===== -->
    <a href="https://whatsapp.com/channel/0029VbBaJvI7IUYbtCeaPh0I" class="home-btn">
        <i class="fab fa-whatsapp"></i> Channel
    </a>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">
        <div class="shimmer-bar"></div>
        
        <div class="header-icon">
            <i class="fas fa-bolt"></i>
        </div>
        
        <h1>REAPER-XMD</h1>
        <p class="subtitle">Enter your WhatsApp number to get pairing code</p>

        <div class="form-group">
            <label for="phone-number"><i class="fas fa-phone" style="margin-right: 8px;"></i>Phone Number</label>
            <div class="input-container">
                <i class="fas fa-comment"></i>
                <input type="text" id="phone-number" placeholder="e.g., 254xxxxxxxx" inputmode="numeric" pattern="[0-9]*">
            </div>
            <div class="error-message" id="error-message">
                <i class="fas fa-exclamation-circle"></i> Please enter a valid phone number (10-15 digits)
            </div>
        </div>

        <div class="btn-group">
            <button id="submit" class="btn">
                <i class="fas fa-key"></i>
                <span id="btn-text">GET CODE</span>
                <span id="btn-spinner" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i>
                </span>
            </button>
            <a href="/qr" class="btn btn-secondary">
                <i class="fas fa-qrcode"></i> QR CODE
            </a>
        </div>

        <div id="loading-spinner">
            <div class="spinner"></div>
        </div>

        <div id="result">
            <p><i class="fas fa-check-circle" style="color: var(--primary);"></i> Your pairing code is:</p>
            <div id="pair-code"></div>
            <p style="font-size: 0.8rem; opacity: 0.6;">Enter this code in WhatsApp linked devices</p>

            <div class="action-buttons">
                <button id="copy-btn" class="action-btn copy-btn">
                    <i class="fas fa-copy"></i> COPY CODE
                </button>
                <a href="./" class="action-btn back-btn">
                    <i class="fas fa-arrow-left"></i> BACK
                </a>
            </div>

            <div class="success-message" id="success-message">
                <i class="fas fa-check-circle"></i> Code copied to clipboard!
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
    <script>
        // ===== HIDE LOADING PAGE =====
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading-page').classList.add('hidden');
            }, 800);
        });

        // ===== RIPPLE EFFECT =====
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // ===== MAIN LOGIC =====
        const submitButton = document.getElementById('submit');
        const phoneNumberInput = document.getElementById('phone-number');
        const resultDiv = document.getElementById('result');
        const pairCodeDiv = document.getElementById('pair-code');
        const copyButton = document.getElementById('copy-btn');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const loadingSpinner = document.getElementById('loading-spinner');

        function validatePhoneNumber(number) {
            const cleaned = number.replace(/\D/g, '');
            return cleaned.length >= 10 && cleaned.length <= 15;
        }

        submitButton.addEventListener('click', async (e) => {
            e.preventDefault();
            const phoneNumber = phoneNumberInput.value.trim();

            if (!validatePhoneNumber(phoneNumber)) {
                errorMessage.style.display = 'block';
                errorMessage.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    errorMessage.style.animation = '';
                }, 500);
                return;
            }

            errorMessage.style.display = 'none';

            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline-block';
            submitButton.disabled = true;
            loadingSpinner.style.display = 'block';

            try {
                const { data } = await axios.get(`/code?number=${phoneNumber}`);
                const code = data.code || "ERROR";

                pairCodeDiv.textContent = code;
                resultDiv.style.display = 'block';
                loadingSpinner.style.display = 'none';

                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (error) {
                pairCodeDiv.textContent = "SERVICE ERROR";
                resultDiv.style.display = 'block';
                loadingSpinner.style.display = 'none';
                console.error("Error:", error);
            } finally {
                btnText.style.display = 'inline-block';
                btnSpinner.style.display = 'none';
                submitButton.disabled = false;
            }
        });

        copyButton.addEventListener('click', () => {
            const code = pairCodeDiv.textContent;
            navigator.clipboard.writeText(code).then(() => {
                successMessage.style.display = 'block';
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 2000);
            });
        });

        phoneNumberInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');

            if (errorMessage.style.display === 'block') {
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
